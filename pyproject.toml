[project]
name = "z-lab"
version = "1.0.0"
description = "Z-Lab personal website and unified developer tools"
requires-python = ">=3.11,<3.14"
dependencies = [
  "aiofiles>=24.1.0",
  "aiosqlite>=0.20.0",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "modal>=1.0.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9,<1",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
